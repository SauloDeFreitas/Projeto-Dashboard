<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar</title>
    <link rel="stylesheet" href="styles.css">
    <script src="scripts.js" defer></script>
</head>
<body>
    <nav id="navCriar">
        <h1>Minha Biblioteca NES</h1>
        <div id="botoesNav">
            <a href="criar.html">+</a>
            <a href="vizualizar.html">Vizu</a>
        </div>
    </nav>
    <main id="mainCriarJogo">
        <form id="formCriarJogo">
            <div id="containerImg">
                <img id="capaJogo">
            </div>
            <div id="containerDados">
                <label for="nomeJogo">Nome</label>
                <input required oninput="procurarImagem()" id="nomeJogo" type="text" placeholder="Digite o nome do jogo">
                <div id="containerNota">
                    <h1>Nota</h1>
                    <input required id="nota1" name="notaJogo" type="radio" value="1">
                    <label for="nota1"><img src="imgs/estrela.svg"></label>
                    
                    <input required id="nota2" name="notaJogo" type="radio" value="2">
                    <label for="nota2"><img src="imgs/estrela.svg"></label>
                
                    <input required id="nota3" name="notaJogo" type="radio" value="3">
                    <label for="nota3"><img src="imgs/estrela.svg"></label>

                    <input required id="nota4" name="notaJogo" type="radio" value="4">
                    <label for="nota4"><img src="imgs/estrela.svg"></label>

                    <input required id="nota5" name="notaJogo" type="radio" value="5">
                    <label for="nota5"><img src="imgs/estrela.svg"></label>
                </div>
                <label for="dataJogo">Data Jogada</label>
                <input required id="dataJogo" type="date">
                <button type="button" onclick="cadastrarJogo()">Criar</button>
            </div>
            <div id="bordaFormCriacao"></div>
        </form>
    </main>
</body>
</html>
